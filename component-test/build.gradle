plugins {
    id 'com.github.hierynomus.license' version '0.16.1'
    id 'org.nosphere.apache.rat' version '0.8.1'
    id 'com.jfrog.artifactory' version '5.2.5'
    id 'org.springframework.boot' version '2.7.18'
    id "io.spring.dependency-management" version "1.1.6"
    id 'maven-publish'
    id 'java'
    id 'idea'
    id 'org.asciidoctor.jvm.convert' version '3.3.2'
}

apply from: '../shared.gradle'

bootJar {
    enabled = false
}

dependencies {
    api(
            [group: 'org.apache.fineract.cn.accounting', name: 'api', version: project.version],
            [group: 'org.apache.fineract.cn.accounting', name: 'service', version: project.version],
            [group: 'org.apache.fineract.cn.accounting', name: 'importer', version: project.version],
            [group: 'org.apache.fineract.cn.anubis', name: 'test', version: versions.frameworkanubis],
            [group: 'org.apache.fineract.cn', name: 'api', version: versions.frameworkapi],
            [group: 'org.apache.fineract.cn', name: 'test', version: versions.frameworktest],
            [group: 'org.apache.fineract.cn', name: 'lang', version: versions.frameworklang],
            [group: 'org.springframework.boot', name: 'spring-boot-starter-test'],
            [group: 'org.springframework.restdocs', name: 'spring-restdocs-mockmvc'],
            [group: 'org.springframework.cloud', name: 'spring-cloud-starter-loadbalancer'],
            // spring-jms / spring-messaging used to arrive on the compile classpath as
            // runtime-scoped transitives of org.apache.fineract.cn:command via Gradle's legacy
            // 'compile' configuration. The modern 'api'/'implementation' configurations no longer
            // expose Maven runtime scope at compile time, so the JMS event listeners in this
            // module need them declared explicitly.
            [group: 'org.springframework', name: 'spring-jms'],
            [group: 'org.springframework', name: 'spring-messaging'],
            [group: 'junit', name: 'junit', version: versions.junit]
    )
}

asciidoctor {
    sourceDir file('build/doc/asciidoc/')
    setOutputDir file('build/doc/html5/')
    outputOptions {
        backends 'html5'
    }
    options doctype: 'book'
    attributes "source-highlighter": "highlightjs", \
                'snippets': file('build/doc/generated-snippets/')
}

jar {
    enabled = true
}

publishing {
    publications {
        componentTest(MavenPublication) {
            from components.java
            version project.findProperty('externalVersion') ?: project.version
        }
    }
}
