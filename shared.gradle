group 'org.apache.fineract.cn.accounting'
version 'spring_boot_2-SNAPSHOT'

ext.versions = [
        frameworkanubis    : 'spring_boot_2-SNAPSHOT',
        frameworkapi       : 'spring_boot_2-SNAPSHOT',
        frameworklang      : 'spring_boot_2-SNAPSHOT',
        frameworkpostgresql: 'spring_boot_2-SNAPSHOT',
        frameworkcassandra : 'spring_boot_2-SNAPSHOT',
        frameworkcommand   : 'spring_boot_2-SNAPSHOT',
        frameworktest      : 'spring_boot_2-SNAPSHOT',
        frameworkasync     : 'spring_boot_2-SNAPSHOT',
        frameworkcustomer  : 'spring_boot_2-SNAPSHOT',
        apachecsvreader    : '1.12.0',
        validator          : '6.2.5.Final',
        netty              : '4.1.115.Final',
        junit              : '4.13.2',
]

apply plugin: 'java-library'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    mavenLocal()
    maven { url 'https://mifos.jfrog.io/mifos/libs-snapshot/' }
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2021.0.9'
    }
}

// override certain dependency versions provided by the Spring Boot BOM.
// NOTE: the former 'cassandra.version' / 'cassandra-driver.version' / 'activemq.version' /
// 'spring-data-releasetrain.version' pins belonged to the (now removed) io.spring.platform
// platform-bom. Spring Boot 2.7 either no longer defines those properties or maps them to
// different coordinates (e.g. com.datastax.oss:java-driver-bom), so they are dropped and the
// Cassandra/ActiveMQ versions are taken from the org.apache.fineract.cn framework libraries.
ext['jackson-bom.version'] = '2.18.11'

dependencies {
    api(
            [group: 'com.google.code.findbugs', name: 'jsr305'],
            [group: 'org.apache.fineract.cn', name: 'postgresql', version: versions.frameworkpostgresql]
    )

    testImplementation(
            [group: 'org.springframework.boot', name: 'spring-boot-starter-test']
    )
}

jar {
    from sourceSets.main.java
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

artifactory {
    contextUrl = System.getenv("ARTIFACTORY_URL")
    publish {
        repository {
            repoKey = project.findProperty('artifactoryRepoKey')
            username = System.getenv("ARTIFACTORY_USER")
            password = System.getenv("ARTIFACTORY_PASSWORD")
        }

        defaults {
            publications ('api', 'service', 'bootService', 'componentTest', 'importer')
        }
    }
}
artifactoryPublish.dependsOn('publishToMavenLocal')

license {
    header rootProject.file('../HEADER')
    strictCheck true
    mapping {
        java = 'SLASHSTAR_STYLE'
        xml = 'XML_STYLE'
        yml = 'SCRIPT_STYLE'
        yaml = 'SCRIPT_STYLE'
    }
}

rat {
    // List of exclude directives, defaults to ['**/.gradle/**']
    excludes = [
            "**/*.log",
            "**/banner.txt",
            "**/.dockerignore/**",
            "**/.idea/**",
            "**/.gradle/**",
            "**/gradle/**",
            "**/build/**",
            "**/*.csv",
            "gradlew",
            "gradlew.bat",
            "README.md",
            ".project",
            "**/.settings/**",
            ".classpath",
            "**/bin/**"
    ]
}
